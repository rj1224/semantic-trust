name: Release to PyPI

# Publishes to PyPI via Trusted Publishing (OIDC) on a version tag.
# No API token is stored anywhere — GitHub mints a short-lived OIDC token that
# PyPI trusts, based on the trusted-publisher config you set on pypi.org.
#
# PyPI trusted-publisher config to match this workflow:
#   Owner:        rj1224
#   Repository:   semantic-trust
#   Workflow:     release.yml
#   Environment:  pypi
# (Register it as a "pending publisher" before the project's first publish.)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/semantic-trust
    permissions:
      id-token: write   # REQUIRED for Trusted Publishing (OIDC); no token needed
      contents: read    # REQUIRED so actions/checkout can read the (private) repo

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Build sdist + wheel
        run: uv build

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        # No `password:` — the action performs the OIDC token exchange automatically.
