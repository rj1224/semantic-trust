# PREPARED — activates on push once a remote is configured (Phase 5).
# Until then this workflow is structurally inert (workflow_dispatch only — cannot auto-fire).
# Phase 5 will change the trigger to: on: push: / pull_request:
name: ci

on:
  workflow_dispatch:

jobs:
  hermetic:
    name: hermetic (no dbt needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: uv sync
      - name: Run secrets check
        run: uv run python scripts/check_secrets.py .
      - name: Run hermetic gate
        run: make ci-hermetic

  dbt12:
    name: dbt-1.12 e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Run dbt-1.12 isolated e2e gate
        run: make ci-dbt12
