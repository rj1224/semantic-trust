[project]
name = "semantic-trust"
version = "0.1.1"
description = "Score and certify dbt Semantic Layer models — trust bands, gates, and dbt-parse certification."
authors = [{ name = "Ravish Jain", email = "ravishjain024@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.0,<2"]    # engine reads the compiled dbt manifest (JSON); MCP = the server SDK
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/rj1224/semantic-trust"
Repository = "https://github.com/rj1224/semantic-trust"

# Entry points (AD-1). MCP server is the skill-facing interface (launched via uvx by the plugin);
# the `semantic-trust` console script is the local dev/testing CLI.
[project.scripts]
semantic-trust-mcp = "trust.mcp_server:main"
semantic-trust = "trust.cli:main_cli"

[project.optional-dependencies]
# ci: fast CI — pytest + hypothesis + pyyaml (e2e tests render YAML). No dbt tree.
ci = ["pytest>=8.0", "hypothesis>=6.0", "pyyaml>=6.0", "ruff>=0.6", "mypy>=1.11"]
# dev adds the dbt-metricflow bundle for `mf validate-configs` (legacy-only) + latest-spec checks.
dev = ["pytest>=8.0", "hypothesis>=6.0", "pyyaml>=6.0", "dbt-metricflow>=0.13,<0.14", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trust*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
files = ["trust"]
ignore_missing_imports = true
